name: Supabase Keep-Alive

# Pings Supabase every couple of days so the free-tier database never sits
# idle long enough to be auto-paused. Doesn't touch or change any data —
# just reads one row.

on:
  schedule:
    - cron: "0 6 */2 * *"   # every 2 days at 06:00 UTC
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (read one row, changes nothing)
        run: |
          curl -sS -o /dev/null -w "Supabase responded with HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/nominations?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
